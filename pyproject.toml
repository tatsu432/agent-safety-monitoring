[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-safety-monitoring"
version = "0.1.0"
description = "Reproducible offline coding-agent safety monitor evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "typer>=0.15,<1", "numpy>=2,<3", "matplotlib>=3.9,<4", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
data = ["inspect-ai>=0.3.150,<0.4"]
tokenizer = ["transformers>=4.55,<5", "jinja2>=3.1,<4"]
tracking = ["wandb>=0.19,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
asm = "agent_safety_monitoring.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
